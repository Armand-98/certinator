[project]
name = "certinator"
version = "0.1.0"
description = "Watch Certificate Transparency logs for domains impersonating a brand, at the moment their certificate is issued."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Armand Zavala" }]
dependencies = []

[project.urls]
Homepage = "https://github.com/Armand-98/certinator"
Repository = "https://github.com/Armand-98/certinator"
Issues = "https://github.com/Armand-98/certinator/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
certinator = "certinator.cli:main"
certi = "certinator.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
